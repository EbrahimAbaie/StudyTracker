{% load jalali l10n %}
<div class="progress-caption"><span>{{ label }}</span><strong>{{ value|percent }}</strong></div>
<div class="progress-track" role="progressbar" aria-label="{{ label }}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ value|unlocalize }}"><span style="width: {{ value|unlocalize }}%"></span></div>
